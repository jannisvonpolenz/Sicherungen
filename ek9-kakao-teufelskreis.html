.hint{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.text{margin:0 0 12px;line-height:2.1}
.gap{display:inline-block;min-width:6em;min-height:1.9em;line-height:1.5;border:0;border-bottom:2px solid var(--accent);background:#eef2f8;padding:0 .45em;border-radius:4px 4px 0 0;cursor:pointer;vertical-align:baseline}
.gap:empty::before{content:"\00a0"}
.slots{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.slots li{display:flex;align-items:stretch;gap:8px}
.slots .nr{flex:0 0 2em;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
.slot{flex:1;min-height:52px;border:1px dashed var(--line);border-radius:6px;background:#fff;text-align:left;padding:8px 12px;cursor:pointer}
.slot.filled{border-style:solid}
.cats{display:grid;gap:10px;margin:0 0 12px}
@media(min-width:560px){.cats.two{grid-template-columns:1fr 1fr}.cats.three{grid-template-columns:1fr 1fr 1fr}}
.cat{border:1px solid var(--line);border-radius:6px;padding:8px;min-height:90px;background:#fff;cursor:pointer;text-align:left;display:block;width:100%}
.cat .cname{font-weight:600;display:block;margin-bottom:6px}
.cat .inner{display:flex;flex-wrap:wrap;gap:6px}
.figure{position:relative;margin:22px 0 26px;border:1px solid var(--line);border-radius:6px;background:#fff}
.figure img,.figure svg{display:block;width:100%;height:auto}
.zone{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:32px;max-width:46%;border:2px solid var(--accent);background:rgba(255,255,255,.92);border-radius:5px;padding:2px 6px;font-size:.85rem;line-height:1.25;cursor:pointer}
.zone:empty::before{content:attr(data-nr);color:var(--accent);font-weight:700}
.q{margin:0 0 14px}
.q p{margin:0 0 6px;font-weight:600}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 12px;min-height:44px;text-align:left;cursor:pointer}
.q p.expl{margin:6px 0 0;font-size:.95rem;font-weight:400}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.sec{background:#fff;color:var(--accent)}
.btn[hidden]{display:none}
.fb{margin:10px 0 0;font-weight:600;min-height:1.2em}
.fb.good{color:var(--ok)}.fb.warn{color:var(--bad)}
.done{border-color:var(--ok)}
#heft{border:2px solid var(--ink);border-radius:8px;padding:14px 16px;margin:24px 0}
#heft[hidden]{display:none}
#heft h2{margin-bottom:8px}
.heftinhalt{background:var(--soft);border-radius:6px;padding:12px 14px;margin:8px 0 0}
.heftinhalt p:first-child{margin-top:0}.heftinhalt p:last-child{margin-bottom:0}
.ergebnis{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0 0 12px}.ergebnis ul{margin:4px 0 0;padding-left:1.2em}.ergtitel{margin:0;font-weight:600}.ergebnis li.nachher{color:var(--bad)}
.locked{color:var(--muted);font-size:.95rem;margin:24px 0 0}
.quelle{color:var(--muted);font-size:.8rem;margin-top:28px}

.lt{line-height:2;margin:0 0 10px}
.lt .seg{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-tap-highlight-color:transparent}
.lt .seg.flash{background:var(--soft);outline:1px dashed var(--line)}
.lt .err.open{background:var(--sel);box-shadow:0 0 0 2px var(--selline) inset}
.lt .err.markiert{text-decoration:underline wavy var(--bad)}
.lt .err.done{cursor:default}
.lt del{color:var(--bad)}
.lt ins{text-decoration:none;background:var(--okbg);border-bottom:2px solid var(--ok);padding:0 .2em}
.ltform{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0 12px;background:#fff}
.ltform p{margin:0 0 6px}
.ltform textarea{width:100%;min-height:64px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical}
.ltform .row{margin-top:8px}
.ltform .vorschlag{background:var(--soft);border-radius:6px;padding:8px 10px;margin:6px 0}
.ltcount{font-weight:600;margin:0 0 8px}
.ltout{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:12px 0 0;background:var(--soft)}
.ltout p{margin:0 0 8px}
</style>
<main id="app"></main>
<script>
(function(){
"use strict";
var D = window.SICHERUNG;
var app = document.getElementById("app");
var solved = [];
var status = [];
var MAXV = 2; /* Versuche pro Aufgabe */
function el(tag, cls, txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function shuffleNotSorted(a){if(a.length<2)return a.slice();var s;do{s=shuffle(a);}while(s.every(function(x,i){return x===a[i];}));return s;}

var h1=el("h1",null,D.titel);app.appendChild(h1);
if(D.intro){app.appendChild(el("p","intro",D.intro));}

function makeTask(a, idx){
  var box=el("section","task");
  box.appendChild(el("h2",null,(D.aufgaben.length>1?("Aufgabe "+(idx+1)+": "):"")+(a.titel||"")));
  if(a.auftrag)box.appendChild(el("p","auftrag",a.auftrag));
  var fb=el("p","fb");var row=el("div","row");
  var check=el("button","btn","Prüfen");var reset=el("button","btn sec","Neu starten");var show=el("button","btn sec","Lösung zeigen");show.hidden=true;
  row.appendChild(check);row.appendChild(reset);row.appendChild(show);
  var tries=0;
  function mark(list){list.forEach(function(x){x.el.classList.remove("ok","bad");x.el.classList.add(x.r?"ok":"bad");});}
  var api={box:box,fb:fb,row:row,check:check,reset:reset,show:show,
    /* Regel 1: Prüfen zählt erst, wenn alles belegt ist */
    incomplete:function(msg){fb.className="fb warn";fb.textContent=msg||"Erst alles einsortieren, dann prüfen.";},
    /* Regel 2: nach Versuch 1 nur die Anzahl, keine Markierung; Regel 3: nach Versuch 2 Fehler zeigen und Lösung anbieten */
    result:function(list,nAll){
      tries++;var nOk=list.filter(function(x){return x.r;}).length;var all=nAll||list.length;var perfect=list.every(function(x){return x.r;});
      if(perfect){mark(list);api.finish(tries===1?"im 1. Versuch richtig":"im 2. Versuch richtig");fb.className="fb good";fb.textContent="Alles richtig.";}
      else if(tries<MAXV){fb.className="fb warn";fb.textContent=nOk+" von "+all+" richtig. Prüft noch einmal genau, ihr habt noch einen Versuch.";}
      else{mark(list);check.disabled=true;reset.hidden=true;show.hidden=false;fb.className="fb warn";fb.textContent=nOk+" von "+all+" richtig. Rot markiert ist falsch. Seht euch jetzt die Lösung an und vergleicht.";}
    },
    solution:function(list){mark(list);api.finish("Lösung angesehen");fb.className="fb";fb.textContent="Das ist die richtige Lösung. Schaut genau, was ihr falsch hattet.";},
    finish:function(st){if(!status[idx])status[idx]=st;box.classList.add("done");check.disabled=true;reset.hidden=true;show.hidden=true;markSolved(idx);},
    canReset:function(){return !box.classList.contains("done")&&tries<MAXV;},
    clearFb:function(){fb.textContent="";fb.className="fb";}
  };
  return api;
}
function markSolved(i){solved[i]=true;updateHeft();}

/* gemeinsame Auswahl: erst Baustein antippen, dann Ziel antippen */
var selected=null;
function select(chip){
  if(selected===chip){chip.classList.remove("sel");selected=null;return;}
  if(selected)selected.classList.remove("sel");
  selected=chip;chip.classList.add("sel");
}
function clearSel(){if(selected)selected.classList.remove("sel");selected=null;}
function clearMarks(root){root.querySelectorAll(".ok,.bad").forEach(function(n){n.classList.remove("ok","bad");});}

/* Typ: reihenfolge */
function reihenfolge(a,t){
  var pool=el("div","pool");var ol=el("ol","slots");
  var slots=a.schritte.map(function(_,i){var li=el("li");li.appendChild(el("span","nr",String(i+1)));var s=el("button","slot");s.type="button";s.dataset.nr=i;li.appendChild(s);ol.appendChild(li);return s;});
  function build(){
    pool.innerHTML="";slots.forEach(function(s){s.textContent="";s.classList.remove("filled","ok","bad");delete s.dataset.val;});
    shuffleNotSorted(a.schritte.map(function(_,i){return i;})).forEach(function(i){var c=el("button","chip",a.schritte[i]);c.type="button";c.dataset.val=i;pool.appendChild(c);});
  }
  pool.addEventListener("click",function(e){var c=e.target.closest(".chip");if(!c)return;t.clearFb();
    var free=slots.filter(function(s){return !s.dataset.val;})[0];if(!free)return;
    free.textContent=c.textContent;free.dataset.val=c.dataset.val;free.classList.add("filled");c.remove();clearMarks(ol);});
  ol.addEventListener("click",function(e){var s=e.target.closest(".slot");if(!s||!s.dataset.val||t.box.classList.contains("done"))return;t.clearFb();
    var c=el("button","chip",s.textContent);c.type="button";c.dataset.val=s.dataset.val;pool.appendChild(c);
    s.textContent="";delete s.dataset.val;s.classList.remove("filled","ok","bad");});
  t.box.appendChild(ol);t.box.appendChild(pool);t.box.appendChild(el("p","hint","Tippe die Schritte in der richtigen Reihenfolge an. Antippen eines Feldes oben legt den Schritt zurück."));
  function liste(){return slots.map(function(s,i){return {el:s,r:Number(s.dataset.val)===i};});}
  t.check.onclick=function(){if(slots.some(function(s){return !s.dataset.val;})){t.incomplete("Erst alle Schritte einsortieren, dann prüfen.");return;}t.result(liste());};
  t.show.onclick=function(){pool.innerHTML="";slots.forEach(function(s,i){s.textContent=a.schritte[i];s.dataset.val=i;s.classList.add("filled");});t.solution(liste());};
  t.reset.onclick=function(){if(!t.canReset())return;t.clearFb();build();};
  build();
}

/* Typ: lueckentext  (Lücken im Text als [[Wort]]) */
function lueckentext(a,t){
  var p=el("p","text");var pool=el("div","pool");var gaps=[];var words=[];
  a.text.split(/(\[\[[^\]]+\]\])/).forEach(function(part){
    var m=part.match(/^\[\[([^\]]+)\]\]$/);
    if(m){var g=el("button","gap");g.type="button";g.dataset.sol=m[1];g.setAttribute("aria-label","Lücke");gaps.push(g);words.push(m[1]);p.appendChild(g);}
    else p.appendChild(document.createTextNode(part));
  });
  function build(){pool.innerHTML="";clearSel();gaps.forEach(function(g){g.textContent="";g.classList.remove("ok","bad");});
    shuffle(words.concat(a.ablenker||[])).forEach(function(w){var c=el("button","chip",w);c.type="button";pool.appendChild(c);});}
  pool.addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)select(c);});
  p.addEventListener("click",function(e){var g=e.target.closest(".gap");if(!g||t.box.classList.contains("done"))return;t.clearFb();g.classList.remove("ok","bad");
    if(selected&&pool.contains(selected)){
      if(g.textContent){var back=el("button","chip",g.textContent);back.type="button";pool.appendChild(back);}
      g.textContent=selected.textContent;selected.remove();selected=null;
    }else if(g.textContent){var back2=el("button","chip",g.textContent);back2.type="button";pool.appendChild(back2);g.textContent="";}
  });
  t.box.appendChild(p);t.box.appendChild(pool);t.box.appendChild(el("p","hint","Erst ein Wort antippen, dann die Lücke. Antippen einer gefüllten Lücke legt das Wort zurück."));
  function liste(){return gaps.map(function(g){return {el:g,r:g.textContent===g.dataset.sol};});}
  t.check.onclick=function(){if(gaps.some(function(g){return !g.textContent;})){t.incomplete("Erst alle Lücken füllen, dann prüfen.");return;}t.result(liste());};
  t.show.onclick=function(){gaps.forEach(function(g){g.textContent=g.dataset.sol;});pool.innerHTML="";t.solution(liste());};
  t.reset.onclick=function(){if(!t.canReset())return;t.clearFb();build();};
  build();
}

/* Typ: zuordnen  (Begriffe in Kategorien sortieren) */
function zuordnen(a,t){
  var n=a.kategorien.length;var cats=el("div","cats"+(n===2?" two":n===3?" three":""));var pool=el("div","pool");var items=[];
  var boxes=a.kategorien.map(function(k,i){var b=el("div","cat");b.setAttribute("role","button");b.tabIndex=0;b.dataset.k=i;b.appendChild(el("span","cname",k.name));var inner=el("div","inner");b.appendChild(inner);cats.appendChild(b);
    k.begriffe.forEach(function(w){items.push({w:w,k:i});});return b;});
  (a.ablenker||[]).forEach(function(w){items.push({w:w,k:-1});});
  function chip(it){var c=el("button","chip",it.w);c.type="button";c.dataset.k=it.k;return c;}
  function build(){pool.innerHTML="";clearSel();boxes.forEach(function(b){b.querySelector(".inner").innerHTML="";});shuffle(items).forEach(function(it){pool.appendChild(chip(it));});}
  pool.addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)select(c);});
  cats.addEventListener("click",function(e){if(t.box.classList.contains("done"))return;t.clearFb();
    var c=e.target.closest(".chip");var b=e.target.closest(".cat");
    if(c&&b&&!selected){c.classList.remove("ok","bad");pool.appendChild(c);return;}
    if(selected&&b){selected.classList.remove("sel","ok","bad");b.querySelector(".inner").appendChild(selected);selected=null;}
  });
  t.box.appendChild(cats);t.box.appendChild(pool);t.box.appendChild(el("p","hint","Erst eine Karte antippen, dann das passende Feld. Antippen einer einsortierten Karte legt sie zurück."+((a.ablenker&&a.ablenker.length)?" Nicht jede Karte gehört in ein Feld.":"")));
  var nReal=items.filter(function(i){return i.k>=0;}).length;
  function liste(){var l=[];boxes.forEach(function(b,i){b.querySelectorAll(".chip").forEach(function(c){l.push({el:c,r:Number(c.dataset.k)===i});});});
    pool.querySelectorAll(".chip").forEach(function(c){if(Number(c.dataset.k)>=0)l.push({el:c,r:false});});return l;}
  function placed(){var n=0;boxes.forEach(function(b){n+=b.querySelectorAll(".chip").length;});return n;}
  t.check.onclick=function(){if(placed()<nReal){t.incomplete("Erst alle Karten einsortieren, dann prüfen.");return;}t.result(liste(),nReal);};
  t.show.onclick=function(){pool.innerHTML="";boxes.forEach(function(b){b.querySelector(".inner").innerHTML="";});items.forEach(function(it){var c=chip(it);if(it.k>=0)boxes[it.k].querySelector(".inner").appendChild(c);else pool.appendChild(c);});t.solution(liste());};
  t.reset.onclick=function(){if(!t.canReset())return;t.clearFb();build();};
  build();
}

/* Typ: schaubild  (Begriffe an nummerierte Stellen einer Abbildung) */
function schaubild(a,t){
  var fig=el("div","figure");
  if(/^\s*<svg/i.test(a.bild)){fig.innerHTML=a.bild;}else{var img=el("img");img.src=a.bild;img.alt=a.bildAlt||"";fig.appendChild(img);}
  var pool=el("div","pool");
  var zones=a.ziele.map(function(z,i){var b=el("button","zone");b.type="button";b.dataset.nr=String(i+1);b.dataset.sol=z.begriff;b.style.left=z.x+"%";b.style.top=z.y+"%";fig.appendChild(b);return b;});
  function build(){pool.innerHTML="";clearSel();zones.forEach(function(z){z.textContent="";z.classList.remove("ok","bad");});
    shuffle(a.ziele.map(function(z){return z.begriff;}).concat(a.ablenker||[])).forEach(function(w){var c=el("button","chip",w);c.type="button";pool.appendChild(c);});}
  pool.addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)select(c);});
  fig.addEventListener("click",function(e){var z=e.target.closest(".zone");if(!z||t.box.classList.contains("done"))return;t.clearFb();z.classList.remove("ok","bad");
    if(selected&&pool.contains(selected)){if(z.textContent){var b=el("button","chip",z.textContent);b.type="button";pool.appendChild(b);}z.textContent=selected.textContent;selected.remove();selected=null;}
    else if(z.textContent){var b2=el("button","chip",z.textContent);b2.type="button";pool.appendChild(b2);z.textContent="";}
  });
  t.box.appendChild(fig);t.box.appendChild(pool);t.box.appendChild(el("p","hint","Erst einen Begriff antippen, dann die passende Nummer im Bild."));
  function liste(){return zones.map(function(z){return {el:z,r:z.textContent===z.dataset.sol};});}
  t.check.onclick=function(){if(zones.some(function(z){return !z.textContent;})){t.incomplete("Erst alle Nummern beschriften, dann prüfen.");return;}t.result(liste());};
  t.show.onclick=function(){zones.forEach(function(z){z.textContent=z.dataset.sol;});pool.innerHTML="";t.solution(liste());};
  t.reset.onclick=function(){if(!t.canReset())return;t.clearFb();build();};
  build();
}

/* Typ: quiz  (Auswahlfragen mit Erklärung; auch Fehlerdetektiv). Jede Frage ein Antippen; höchstens zwei Durchgänge. */
function quiz(a,t){
  var wrap=el("div");var answered=0,correct=0,run=0;
  function build(){run++;wrap.innerHTML="";answered=0;correct=0;t.reset.hidden=true;
    a.fragen.forEach(function(f){var q=el("div","q");q.appendChild(el("p",null,f.frage));var opts=el("div","opts");var ex=el("p","expl");var done=false;
      shuffle(f.optionen.map(function(o,i){return i;})).forEach(function(i){var b=el("button","opt",f.optionen[i]);b.type="button";
        b.onclick=function(){if(done||t.box.classList.contains("done"))return;done=true;answered++;var r=i===f.richtig;if(r)correct++;b.classList.add(r?"ok":"bad");
          if(!r)opts.querySelectorAll(".opt").forEach(function(o){if(o.textContent===f.optionen[f.richtig])o.classList.add("ok");});
          ex.textContent=(r?"Richtig. ":"Nicht ganz. ")+(f.erklaerung||"");
          if(answered===a.fragen.length)auswerten();};
        opts.appendChild(b);});
      q.appendChild(opts);q.appendChild(ex);wrap.appendChild(q);});
  }
  function auswerten(){var all=a.fragen.length;
    if(correct===all){t.finish(run===1?"im 1. Versuch richtig":"im 2. Versuch richtig");t.fb.className="fb good";t.fb.textContent="Alles richtig.";}
    else if(run<MAXV){t.fb.className="fb warn";t.fb.textContent=correct+" von "+all+" richtig. Lest die Erklärungen und startet dann den zweiten Versuch.";t.reset.hidden=false;t.reset.textContent="Zweiter Versuch";}
    else{t.finish("Erklärungen gelesen");t.fb.className="fb warn";t.fb.textContent=correct+" von "+all+" richtig. Lest die Erklärungen genau.";}
  }
  t.box.appendChild(wrap);
  t.check.hidden=true;t.show.hidden=true;t.show.remove();
  t.reset.onclick=function(){if(t.box.classList.contains("done")||run>=MAXV)return;t.clearFb();build();};
  build();
}

/* Typ: luegentext  (Fehler im Text finden und selbst korrigieren; Prüfung über Schlüsselbegriffe, sonst Selbstvergleich mit Lösungsvorschlag) */
function luegentext(a,t){
  var errs=a.teile.filter(function(p){return typeof p!=="string";});var nErr=errs.length;var fixed=0,own=0,wrongTaps=0,hinted=false;
  function norm(s){return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\s+/g," ");}
  function passt(txt,e){var n=norm(txt);return (e.schluessel||[]).some(function(alt){return alt.every(function(grp){return grp.some(function(w){return n.indexOf(norm(w))>=0;});});});}
  var count=el("p","ltcount");var lt=el("p","lt");var form=el("div","ltform");form.hidden=true;var open=null;
  function upd(){count.textContent="Korrigiert: "+fixed+" von "+nErr;}
  a.teile.forEach(function(p){
    if(typeof p==="string"){(p.match(/[^.,;:!?]*[.,;:!?]+\s*|[^.,;:!?]+$/g)||[p]).forEach(function(s0){var s=s0.trim();if(!s)return;if(/^\s/.test(s0))lt.appendChild(document.createTextNode(" "));if(/^[.,;:!?]+$/.test(s)){lt.appendChild(document.createTextNode(s));}else{var sp=el("span","seg",s);sp.onclick=function(){if(t.box.classList.contains("done"))return;wrongTaps++;sp.classList.add("flash");t.fb.className="fb";t.fb.textContent="Diese Stelle stimmt so.";setTimeout(function(){sp.classList.remove("flash");},900);};lt.appendChild(sp);}if(/\s$/.test(s0))lt.appendChild(document.createTextNode(" "));});}
    else{var sp=el("span","seg err",p.falsch);p.el=sp;sp.onclick=function(){if(p.erledigt||t.box.classList.contains("done"))return;t.clearFb();oeffne(p);};lt.appendChild(sp);}
  });
  function oeffne(p){if(open&&open.el)open.el.classList.remove("open");open=p;p.el.classList.add("open");form.innerHTML="";form.hidden=false;
    form.appendChild(el("p",null,"Hier stimmt etwas nicht: „"+p.falsch+"“. Schreibe eine richtige Fassung."));
    var ta=el("textarea");ta.setAttribute("aria-label","Deine Korrektur");form.appendChild(ta);var info=el("div");form.appendChild(info);
    var r=el("div","row");var ok=el("button","btn","Korrektur prüfen");ok.type="button";r.appendChild(ok);form.appendChild(r);
    ok.onclick=function(){var v=ta.value.trim();if(v.length<3){info.innerHTML="";info.appendChild(el("p","fb warn","Schreibe erst deine Korrektur hinein."));return;}
      if(passt(v,p)){fertig(p,v,true);return;}var nv=norm(v);if(norm(p.falsch).indexOf(nv)>=0){info.innerHTML="";info.appendChild(el("p","fb warn","Das steht so schon im Text. Was muss anders sein?"));return;}var fw=(p.falschwoerter||[]).filter(function(w){return nv.indexOf(norm(w))>=0;});if(fw.length){info.innerHTML="";info.appendChild(el("p","fb warn","In deiner Fassung steckt noch „"+fw[0]+"“. Was muss anders sein?"));return;}
      info.innerHTML="";info.appendChild(el("p",null,"Das erkenne ich nicht sicher. Vergleiche deine Fassung mit diesem Vorschlag:"));info.appendChild(el("p","vorschlag",p.loesung));
      var r2=el("div","row");var b1=el("button","btn","Meine Fassung meint dasselbe");b1.type="button";var b2=el("button","btn sec","Vorschlag übernehmen");b2.type="button";var b3=el("button","btn sec","Nochmal schreiben");b3.type="button";
      b1.onclick=function(){fertig(p,v,true);};b2.onclick=function(){fertig(p,p.loesung,false);};b3.onclick=function(){info.innerHTML="";ta.focus();};
      r2.appendChild(b1);r2.appendChild(b2);r2.appendChild(b3);info.appendChild(r2);};
    form.scrollIntoView({behavior:"smooth",block:"nearest"});ta.focus();}
  function fertig(p,text,eigen){p.erledigt=true;p.text=text;fixed++;if(eigen)own++;p.el.classList.remove("open","markiert");p.el.classList.add("done");p.el.innerHTML="";
    var d=el("del",null,p.falsch);var i=el("ins",null,text);p.el.appendChild(d);p.el.appendChild(document.createTextNode(" "));p.el.appendChild(i);
    form.hidden=true;open=null;t.fb.className="fb good";t.fb.textContent=p.erklaerung||"Korrigiert.";upd();
    if(fixed===nErr){abschluss();}}
  function abschluss(){var st=own===nErr?(hinted?"alle Fehler selbst korrigiert (mit Tipp)":"alle Fehler selbst gefunden und korrigiert"):(own+" von "+nErr+" selbst korrigiert, Rest mit Vorschlag");
    t.finish(st);t.fb.className="fb good";t.fb.textContent="Alle Fehler korrigiert.";hintB.hidden=true;
    var txt=a.teile.map(function(p){return typeof p==="string"?p:p.text;}).join("").replace(/\s+/g," ").trim();
    var out=el("div","ltout");out.appendChild(el("p",null,"Dein berichtigter Text:"));out.appendChild(el("p",null,txt));var cp=el("button","btn","Text kopieren");cp.type="button";
    var msg=el("p","hint");cp.onclick=function(){function done(){msg.textContent="Kopiert. Füge den Text in OneNote ein.";}
      if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fallback);}else{fallback();}
      function fallback(){var ta=el("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){msg.textContent="Markiere den Text und kopiere ihn von Hand.";}ta.remove();}};
    out.appendChild(cp);out.appendChild(msg);t.box.insertBefore(out,t.row);}
  var hintB=el("button","btn sec","Tipp: Fehlerstellen markieren");hintB.type="button";hintB.onclick=function(){hinted=true;errs.forEach(function(p){if(!p.erledigt)p.el.classList.add("markiert");});hintB.hidden=true;};
  t.box.appendChild(count);t.box.appendChild(lt);t.box.appendChild(form);t.box.appendChild(el("p","hint","Tippe eine Stelle an, die du für falsch hältst. Schreibe dann eine richtige Fassung hinein."));
  t.check.hidden=true;t.reset.hidden=true;t.show.hidden=true;t.row.appendChild(hintB);upd();
}

var TYPES={luegentext:luegentext,reihenfolge:reihenfolge,lueckentext:lueckentext,zuordnen:zuordnen,schaubild:schaubild,quiz:quiz};
D.aufgaben.forEach(function(a,i){solved[i]=false;var t=makeTask(a,i);TYPES[a.typ](a,t);t.box.appendChild(t.row);t.box.appendChild(t.fb);app.appendChild(t.box);});

var lock=el("p","locked","Wenn alle Aufgaben gelöst sind, erscheint hier dein Eintrag für die Mappe.");
var heft=el("section");heft.id="heft";heft.hidden=true;
heft.appendChild(el("h2",null,D.heft.titel||"In die Mappe"));
if(D.heft.auftrag)heft.appendChild(el("p",null,D.heft.auftrag));
var erg=el("div","ergebnis");heft.appendChild(erg);
var hi=el("div","heftinhalt");hi.innerHTML=D.heft.inhalt;heft.appendChild(hi);
app.appendChild(lock);app.appendChild(heft);
function updateHeft(){var all=solved.every(Boolean);heft.hidden=!all;lock.hidden=all;
  if(all){erg.innerHTML="";erg.appendChild(el("p","ergtitel","Euer Ergebnis:"));var ul=el("ul");D.aufgaben.forEach(function(a,i){ul.appendChild(el("li",status[i]==="Lösung angesehen"||status[i]==="Erklärungen gelesen"?"nachher":null,"Aufgabe "+(i+1)+": "+status[i]));});erg.appendChild(ul);}if(all&&!updateHeft.scrolled){updateHeft.scrolled=true;setTimeout(function(){heft.scrollIntoView({behavior:"smooth",block:"start"});},250);}}
if(D.quelle){app.appendChild(el("p","quelle",D.quelle));}
document.addEventListener("click",function(e){if(!e.target.closest(".chip,.gap,.zone,.cat,.slot"))clearSel();});
})();
